name: Xuất bản album kỷ niệm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ghép và mở gói website
        run: |
          cat site-source.zip.001 site-source.zip.002 site-source.zip.003 > /tmp/site-source.zip
          mkdir site
          unzip -q /tmp/site-source.zip -d site
          mkdir -p site/.openai
          printf '{}\n' > site/.openai/hosting.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Dựng website
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
